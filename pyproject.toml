[project]
name = "pkms"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "anthropic",
  "qdrant-client",
  "mem0ai",
  "watchdog",
  "pdfminer.six",
  "fastapi",
  "uvicorn",
  "gitpython",
  "pyyaml",
  "httpx",
  "python-multipart",
  "jinja2",
  "python-dotenv>=1.2.2",
  "numpy",          # A-MEM provider: cosine similarity over local zettel embeddings
]

[project.optional-dependencies]
# Heavy, local, zero-LLM-write memory provider (chromadb + onnx + a ~79MB model
# downloaded on first use). Only needed when memory.provider == mempalace.
mempalace = ["mempalace"]

[project.scripts]
pkms = "pkms.coordinator:main"

[dependency-groups]
dev = [
  "pytest",
]
